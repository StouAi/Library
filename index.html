<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bookContainer">
        <div class="bookshelf">

        </div>
        
        <button id="openDialogBtn">Add book</button>
    </div>

    <dialog id="myDialog">
        <form method="dialog">
            <label for="bookTitle">Book Title:</label>
            <input type="text" id="bookTitle" name="bookTitle" required>
            <br><br>
            <label for="bookAuthor">Author:</label>
            <input type="text" id="bookAuthor" name="bookAuthor" required>
            <br><br>
            <label for="pages">Pages:</label>
            <input type="number" id="pages" name="pages" required>
            <br><br>
            <label for="readStatus">Read Status:</label>
            <select id="readStatus" name="readStatus" required>
                <option value="not read">Not Read</option>
                <option value="read">Read</option>
            </select>
            <br><br>
            <button type="submit" id="submitBtn">Add Book</button>
            <button type="button" id="closeDialogBtn">Cancel</button>
        </form>
    </dialog>
    

    <script src="script.js"></script>
</body>
</html>
